[pytest]
minversion = 6.0
addopts = -ra -q
testpaths =
	src/mmv_h4tracks/_tests

filterwarnings =
	ignore::DeprecationWarning

markers =
	combobox
	broken
	new
	unit
	integration
	eval
	eval_seg
	eval_tracking
	not_implemented
	widget
	processing
	format
	system
	tracking
	misc
	onclick
	worker
	schema
	justin
